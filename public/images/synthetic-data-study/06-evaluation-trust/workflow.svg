<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>6강: 주장과 근거를 연결하는 평가</title><rect width="960" height="550" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">6강: 주장과 근거를 연결하는 평가</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 이 비교와 관찰로 어디까지 주장할 수 있는가?</text><rect x="40" y="120" width="250" height="105" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="57" y="150" font-size="21" fill="#174ea6">1  목표 주장</text><text x="57" y="178" font-size="17" fill="#3c4043">데이터 품질 / 학습 효과</text><text x="57" y="202" font-size="17" fill="#3c4043">사용 환경의 성공 조건</text><rect x="355" y="120" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="372" y="150" font-size="21" fill="#b06000">2  자료 계통</text><text x="372" y="178" font-size="17" fill="#3c4043">원천·생성·수정 기록</text><text x="372" y="202" font-size="17" fill="#3c4043">학습과 평가의 분리</text><rect x="670" y="120" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="687" y="150" font-size="21" fill="#b06000">3  비교 조건</text><text x="687" y="178" font-size="17" fill="#3c4043">대조군·토큰·계산 예산</text><text x="687" y="202" font-size="17" fill="#3c4043">고정한 조건과 남은 차이</text><rect x="670" y="325" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="687" y="355" font-size="21" fill="#b06000">4  지표·감사</text><text x="687" y="383" font-size="17" fill="#3c4043">분모·표집·오류 유형</text><text x="687" y="407" font-size="17" fill="#3c4043">통과와 탈락 양쪽 확인</text><rect x="355" y="325" width="250" height="105" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="372" y="355" font-size="21" fill="#137333">5  독립 평가</text><text x="372" y="383" font-size="17" fill="#3c4043">목표 분포·집단별 결과</text><text x="372" y="407" font-size="17" fill="#3c4043">불확실성·위반·전체 비용</text><rect x="40" y="325" width="250" height="105" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="355" font-size="21" fill="#137333">6  근거 보고</text><text x="57" y="383" font-size="17" fill="#3c4043">관찰 / 가정 / 미확인</text><text x="57" y="407" font-size="17" fill="#3c4043">다음 검사와 중단 기준</text><path d="M290 172 H345" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 172 H660" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M795 225 V315" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 377 H615" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 377 H300" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="485" font-size="19" fill="#202124">데이터 품질 ≠ 학습 효과  ·  출처 기록 ≠ 정확성 보장</text><text x="40" y="527" font-size="16" fill="#3c4043">파랑: 입력·목표  ·  주황: 판단·처리  ·  초록: 검증·산출물</text></svg>