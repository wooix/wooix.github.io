<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>6강 학습 지도</title><rect width="960" height="570" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">6강 학습 지도</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 이 비교와 관찰로 어디까지 주장할 수 있는가?</text><rect x="40" y="105" width="420" height="102" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="57" y="135" font-size="21" fill="#174ea6">1  평가 질문</text><text x="57" y="163" font-size="17" fill="#3c4043">자료·학습·환경의 주장</text><text x="57" y="187" font-size="17" fill="#3c4043">주장마다 필요한 증거</text><rect x="500" y="105" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="517" y="135" font-size="21" fill="#b06000">2  비교 설계</text><text x="517" y="163" font-size="17" fill="#3c4043">대조군·예산·분할</text><text x="517" y="187" font-size="17" fill="#3c4043">같게 한 조건을 명시</text><rect x="40" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="57" y="255" font-size="21" fill="#b06000">3  지표와 분모</text><text x="57" y="283" font-size="17" fill="#3c4043">채택 정밀도·유효 보존율</text><text x="57" y="307" font-size="17" fill="#3c4043">오류율의 분모를 구별</text><rect x="500" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="517" y="255" font-size="21" fill="#b06000">4  신뢰성</text><text x="517" y="283" font-size="17" fill="#3c4043">출처·개인정보·집단 오류</text><text x="517" y="307" font-size="17" fill="#3c4043">반복 생성의 변화 추적</text><rect x="40" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="375" font-size="21" fill="#137333">5  결과 해석</text><text x="57" y="403" font-size="17" fill="#3c4043">문항 평균과 목표 분포</text><text x="57" y="427" font-size="17" fill="#3c4043">불확실성·비용의 경계</text><rect x="500" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="517" y="375" font-size="21" fill="#137333">6  종합 설계</text><text x="517" y="403" font-size="17" fill="#3c4043">1–5강 산출물 통합</text><text x="517" y="427" font-size="17" fill="#3c4043">미측정 결과는 비워 두기</text><rect x="40" y="465" width="880" height="76" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="495" font-size="21" fill="#137333">7  최종 산출물: 연구 설계서 + 자료 계통도 + 근거 장부</text><text x="57" y="523" font-size="17" fill="#3c4043">가장 중요한 미확인 주장 하나를 작은 검사로 확인한다.</text></svg>