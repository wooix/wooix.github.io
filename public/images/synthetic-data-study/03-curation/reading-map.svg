<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>3강 학습 지도</title><desc>일곱 절을 순서대로 복습하며 각각의 질문과 산출물을 연결한다.</desc><rect width="960" height="570" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">3강 학습 지도</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 필요한 학습 경험을 남기면서 오류와 반복을 어떻게 줄일까?</text><rect x="40" y="105" width="420" height="102" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="58" y="136" font-size="21" fill="#174ea6">1  역할</text><text x="58" y="164" font-size="17" fill="#3c4043">제외·수정·선택·비중 조정</text><text x="58" y="188" font-size="17" fill="#3c4043">오류 ≠ 미선택</text><rect x="500" y="105" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="518" y="136" font-size="21" fill="#b06000">2  검증</text><text x="518" y="164" font-size="17" fill="#3c4043">형식·근거·판정 불확실성</text><text x="518" y="188" font-size="17" fill="#3c4043">검사별 근거를 기록</text><rect x="40" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="58" y="256" font-size="21" fill="#b06000">3  중복·분할</text><text x="58" y="284" font-size="17" fill="#3c4043">문맥과 조건, 변형 계통</text><text x="58" y="308" font-size="17" fill="#3c4043">유사성 ≠ 같은 정답</text><rect x="500" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="518" y="256" font-size="21" fill="#b06000">4  선택·구성</text><text x="518" y="284" font-size="17" fill="#3c4043">점수·다양성·학습 노출</text><text x="518" y="308" font-size="17" fill="#3c4043">샘플 점수 ≠ 집합 가치</text><rect x="40" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="58" y="376" font-size="21" fill="#137333">5  절차</text><text x="58" y="404" font-size="17" fill="#3c4043">원본 → 판정 → 학습본</text><text x="58" y="428" font-size="17" fill="#3c4043">수정본은 재검사</text><rect x="500" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="518" y="376" font-size="21" fill="#137333">6  실습</text><text x="518" y="404" font-size="17" fill="#3c4043">같은 후보에서 P1·P2 비교</text><text x="518" y="428" font-size="17" fill="#3c4043">구성 차이 ≠ 성능 차이</text><rect x="40" y="465" width="880" height="76" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="58" y="496" font-size="21" fill="#137333">7  인계: 코드와 실행 기반 검증</text><text x="58" y="524" font-size="17" fill="#3c4043">선택 결과·제외 이유·빠진 유형을 다음 검증 계획으로 넘긴다.</text></svg>