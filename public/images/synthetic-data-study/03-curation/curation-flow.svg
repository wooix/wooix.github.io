<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>큐레이션: 원본에서 학습본까지</title><desc>원본을 보존하고 검사, 중복 검토, 구성 선택, 변환 및 기록을 수행하며 보류·수정본은 재검사한다.</desc><rect width="960" height="560" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">큐레이션: 원본에서 학습본까지</text><text x="40" y="77" font-size="17" fill="#3c4043">정답 여부와 선택 여부를 분리하고, 수정하면 관련 검사를 다시 한다.</text><rect x="40" y="110" width="250" height="100" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="58" y="141" font-size="21" fill="#174ea6">1  원본·분할 고정</text><text x="58" y="169" font-size="17" fill="#3c4043">문서·시드·버전 기록</text><text x="58" y="193" font-size="17" fill="#3c4043">평가의 일반화 목표 정의</text><rect x="355" y="110" width="250" height="100" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="373" y="141" font-size="21" fill="#b06000">2  형식·근거 검사</text><text x="373" y="169" font-size="17" fill="#3c4043">응답과 규정 대조</text><text x="373" y="193" font-size="17" fill="#3c4043">자격 / 보류 / 오류 구분</text><rect x="670" y="110" width="250" height="100" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="688" y="141" font-size="21" fill="#b06000">3  중복 계통 검토</text><text x="688" y="169" font-size="17" fill="#3c4043">문맥·질문·응답 비교</text><text x="688" y="193" font-size="17" fill="#3c4043">조건이 다른 사례 보존</text><rect x="670" y="345" width="250" height="100" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="688" y="376" font-size="21" fill="#b06000">4  구성 선택</text><text x="688" y="404" font-size="17" fill="#3c4043">유효한 후보 안에서 선택</text><text x="688" y="428" font-size="17" fill="#3c4043">예산·유형별 구성을 기록</text><rect x="355" y="345" width="250" height="100" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="373" y="376" font-size="21" fill="#137333">5  학습본 변환</text><text x="373" y="404" font-size="17" fill="#3c4043">필요한 입력·응답 추출</text><text x="373" y="428" font-size="17" fill="#3c4043">변환 후 형식 재검사</text><rect x="40" y="345" width="250" height="100" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="58" y="376" font-size="21" fill="#137333">6  결과·이력 보고</text><text x="58" y="404" font-size="17" fill="#3c4043">원본·판정·학습본 연결</text><text x="58" y="428" font-size="17" fill="#3c4043">빠진 유형과 제외 이유</text><rect x="355" y="245" width="250" height="72" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="373" y="276" font-size="21" fill="#b06000">보류·수정</text><text x="373" y="304" font-size="17" fill="#3c4043">원본 보존 → 재검토</text><path d="M290 160 H345" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 160 H660" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><text x="613" y="145" font-size="13" fill="#3c4043">통과</text><path d="M795 210 V335" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 395 H615" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 395 H300" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M480 210 V235" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><path d="M355 280 H326 V187 H345" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="6 5"/><text x="40" y="493" font-size="20" fill="#202124">선택에서 빠졌다고 오답은 아니다. 다양성을 위해 오답을 남기지도 않는다.</text><text x="40" y="531" font-size="16" fill="#3c4043">파랑: 입력과 기준  ·  주황: 판단과 조정  ·  초록: 산출물  ·  점선: 보류·재검토</text></svg>