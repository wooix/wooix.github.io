<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>5강: 추론과 행동의 데이터 지도</title><rect width="960" height="550" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">5강: 추론과 행동의 데이터 지도</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 어느 단계에 어떤 검증 근거와 학습 신호가 들어오는가?</text><rect x="40" y="120" width="250" height="105" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="57" y="150" font-size="21" fill="#174ea6">1  목표·명세</text><text x="57" y="178" font-size="17" fill="#3c4043">문제와 필요한 행동</text><text x="57" y="202" font-size="17" fill="#3c4043">규정·API·상태 계통</text><rect x="355" y="120" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="372" y="150" font-size="21" fill="#b06000">2  후보 생성</text><text x="372" y="178" font-size="17" fill="#3c4043">추론 응답 또는 행동</text><text x="372" y="202" font-size="17" fill="#3c4043">생성기의 버전·조건</text><rect x="670" y="120" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="687" y="150" font-size="21" fill="#b06000">3  관측 출처 구분</text><text x="687" y="178" font-size="17" fill="#3c4043">실제 실행 / 모사 / 창작</text><text x="687" y="202" font-size="17" fill="#3c4043">실제 상태와 혼동 금지</text><rect x="670" y="325" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="687" y="355" font-size="21" fill="#b06000">4  검증·선별</text><text x="687" y="383" font-size="17" fill="#3c4043">답·과정·행동의 검사</text><text x="687" y="407" font-size="17" fill="#3c4043">판정 근거와 한계 기록</text><rect x="355" y="325" width="250" height="105" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="372" y="355" font-size="21" fill="#137333">5  학습 신호 변환</text><text x="372" y="383" font-size="17" fill="#3c4043">SFT 목표 또는 RL 보상</text><text x="372" y="407" font-size="17" fill="#3c4043">입력 관측과 행동 구별</text><rect x="40" y="325" width="250" height="105" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="355" font-size="21" fill="#137333">6  독립 평가</text><text x="57" y="383" font-size="17" fill="#3c4043">실제 환경·새 문제 계통</text><text x="57" y="407" font-size="17" fill="#3c4043">성공·위반·비용을 분리</text><path d="M290 172 H345" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 172 H660" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M795 225 V315" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 377 H615" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 377 H300" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="485" font-size="19" fill="#202124">모사 일관성 ≠ 실제 상태 보장  ·  완료 선언 ≠ 목표 달성</text><text x="40" y="527" font-size="16" fill="#3c4043">파랑: 입력·목표  ·  주황: 판단·처리  ·  초록: 검증·산출물</text></svg>