<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>5강 학습 지도</title><rect width="960" height="570" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">5강 학습 지도</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 어느 단계에 어떤 검증 근거와 학습 신호가 들어오는가?</text><rect x="40" y="105" width="420" height="102" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="57" y="135" font-size="21" fill="#174ea6">1  신호</text><text x="57" y="163" font-size="17" fill="#3c4043">응답·보상·관측·행동</text><text x="57" y="187" font-size="17" fill="#3c4043">생성 ≠ 가중치 갱신</text><rect x="500" y="105" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="517" y="135" font-size="21" fill="#b06000">2  추론</text><text x="517" y="163" font-size="17" fill="#3c4043">R1-Zero / R1 / 증류</text><text x="517" y="187" font-size="17" fill="#3c4043">단계별 데이터의 역할</text><rect x="40" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="57" y="255" font-size="21" fill="#b06000">3  궤적</text><text x="57" y="283" font-size="17" fill="#3c4043">이력에서 다음 행동 예측</text><text x="57" y="307" font-size="17" fill="#3c4043">관측 ≠ 숨은 상태 전체</text><rect x="500" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="517" y="255" font-size="21" fill="#b06000">4  모사·평가</text><text x="517" y="283" font-size="17" fill="#3c4043">ESAT의 검증 범위</text><text x="517" y="307" font-size="17" fill="#3c4043">실제 환경 전이는 별도 검사</text><rect x="40" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="375" font-size="21" fill="#137333">5  데이터 지도</text><text x="57" y="403" font-size="17" fill="#3c4043">생성 → 선별 → 학습 → 평가</text><text x="57" y="427" font-size="17" fill="#3c4043">출처와 분할 계통 보존</text><rect x="500" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="517" y="375" font-size="21" fill="#137333">6  실습</text><text x="517" y="403" font-size="17" fill="#3c4043">가상 API의 상태 대조</text><text x="517" y="427" font-size="17" fill="#3c4043">실제 실행은 모두 미확인</text><rect x="40" y="465" width="880" height="76" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="495" font-size="21" fill="#137333">7  인계: 평가와 종합 설계</text><text x="57" y="523" font-size="17" fill="#3c4043">관찰한 근거와 앞으로 확인할 항목을 나누어 보고한다.</text></svg>