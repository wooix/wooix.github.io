<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 570" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>4강 학습 지도</title><rect width="960" height="570" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">4강 학습 지도</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 테스트를 통과했다는 말에는 어떤 조건이 붙어야 할까?</text><rect x="40" y="105" width="420" height="102" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="57" y="135" font-size="21" fill="#174ea6">1  명세</text><text x="57" y="163" font-size="17" fill="#3c4043">입력 범위와 기대 행동</text><text x="57" y="187" font-size="17" fill="#3c4043">코드보다 채점 기준 먼저</text><rect x="500" y="105" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="517" y="135" font-size="21" fill="#b06000">2  생성·실행</text><text x="517" y="163" font-size="17" fill="#3c4043">문제·코드·테스트 구별</text><text x="517" y="187" font-size="17" fill="#3c4043">출처와 실행 상태를 분리</text><rect x="40" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="57" y="255" font-size="21" fill="#b06000">3  충분성</text><text x="57" y="283" font-size="17" fill="#3c4043">반례·경계·기대값 검토</text><text x="57" y="307" font-size="17" fill="#3c4043">테스트 수 ≠ 검출 능력</text><rect x="500" y="225" width="420" height="102" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="517" y="255" font-size="21" fill="#b06000">4  선별·수정</text><text x="517" y="283" font-size="17" fill="#3c4043">통과 라벨에 검사 버전</text><text x="517" y="307" font-size="17" fill="#3c4043">수정 피드백 ≠ 최종 평가</text><rect x="40" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="375" font-size="21" fill="#137333">5  절차</text><text x="57" y="403" font-size="17" fill="#3c4043">명세 → 로그 → 학습본</text><text x="57" y="427" font-size="17" fill="#3c4043">감독 신호의 용도 명시</text><rect x="500" y="345" width="420" height="102" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="517" y="375" font-size="21" fill="#137333">6  실습</text><text x="517" y="403" font-size="17" fill="#3c4043">약한 검사와 확장 검사</text><text x="517" y="427" font-size="17" fill="#3c4043">수작업 네 후보의 실행 비교</text><rect x="40" y="465" width="880" height="76" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="495" font-size="21" fill="#137333">7  인계: 추론과 에이전트</text><text x="57" y="523" font-size="17" fill="#3c4043">한 번의 출력에서 여러 단계의 행동·관측·검증으로 확장한다.</text></svg>