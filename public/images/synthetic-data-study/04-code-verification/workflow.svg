<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 550" font-family="-apple-system,BlinkMacSystemFont,Arial,sans-serif"><title>4강: 코드 검증의 증거 연결</title><rect width="960" height="550" fill="white"/><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#5f6368"/></marker></defs><text x="40" y="45" font-size="27" fill="#202124">4강: 코드 검증의 증거 연결</text><text x="40" y="77" font-size="17" fill="#3c4043">질문: 테스트를 통과했다는 말에는 어떤 조건이 붙어야 할까?</text><rect x="40" y="120" width="250" height="105" rx="12" stroke="#1a73e8" fill="#e8f0fe" stroke-width="2"/><text x="57" y="150" font-size="21" fill="#174ea6">1  명세 고정</text><text x="57" y="178" font-size="17" fill="#3c4043">유효 입력·기대 행동</text><text x="57" y="202" font-size="17" fill="#3c4043">문제·규정 버전 기록</text><rect x="355" y="120" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="372" y="150" font-size="21" fill="#b06000">2  생성 대상 분리</text><text x="372" y="178" font-size="17" fill="#3c4043">문제 / 후보 코드 / 테스트</text><text x="372" y="202" font-size="17" fill="#3c4043">출처와 의존 관계 기록</text><rect x="670" y="120" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="687" y="150" font-size="21" fill="#b06000">3  기대값 검토</text><text x="687" y="178" font-size="17" fill="#3c4043">명세·참조 구현 대조</text><text x="687" y="202" font-size="17" fill="#3c4043">잘못된 테스트도 확인</text><rect x="670" y="325" width="250" height="105" rx="12" stroke="#f9ab00" fill="#fef7e0" stroke-width="2"/><text x="687" y="355" font-size="21" fill="#b06000">4  제한된 환경 실행</text><text x="687" y="383" font-size="17" fill="#3c4043">상태·출력·오류 기록</text><text x="687" y="407" font-size="17" fill="#3c4043">미실행은 통과가 아님</text><rect x="355" y="325" width="250" height="105" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="372" y="355" font-size="21" fill="#137333">5  반례 분석</text><text x="372" y="383" font-size="17" fill="#3c4043">코드와 검사 오류 구분</text><text x="372" y="407" font-size="17" fill="#3c4043">수정 후 새 버전 재검사</text><rect x="40" y="325" width="250" height="105" rx="12" stroke="#137333" fill="#e6f4ea" stroke-width="2"/><text x="57" y="355" font-size="21" fill="#137333">6  범위별 선별</text><text x="57" y="383" font-size="17" fill="#3c4043">어떤 검사에서 통과했나</text><text x="57" y="407" font-size="17" fill="#3c4043">최종 평가는 별도 유지</text><path d="M290 172 H345" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M605 172 H660" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M795 225 V315" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M670 377 H615" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M355 377 H300" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="485" font-size="19" fill="#202124">실행 성공 ≠ 테스트 통과 ≠ 모든 입력에서의 명세 충족</text><text x="40" y="527" font-size="16" fill="#3c4043">파랑: 입력·목표  ·  주황: 판단·처리  ·  초록: 검증·산출물</text></svg>