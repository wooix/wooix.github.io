<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520" role="img" aria-label="2강 지도: 생성량보다 학습 경험을 설계하기" font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="900" height="520" rx="12" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5f6368"/></marker></defs><text x="30" y="45" font-size="25" font-weight="700" fill="#202124">2강 지도: 생성량보다 학습 경험을 설계하기</text><rect x="30" y="85" width="410" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8"/><text x="48" y="114" font-size="20" font-weight="700" fill="#202124">1 목표</text><text x="48" y="142" font-size="17" fill="#3c4043">행동·사용 단계 → 데이터셋 명세</text><rect x="470" y="85" width="410" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8"/><text x="488" y="114" font-size="20" font-weight="700" fill="#202124">2 범위</text><text x="488" y="142" font-size="17" fill="#3c4043">주제·조건·난이도 → 유효한 칸</text><rect x="30" y="184" width="410" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8"/><text x="48" y="213" font-size="20" font-weight="700" fill="#202124">3 입력</text><text x="48" y="241" font-size="17" fill="#3c4043">과제·조건·예제 → 생성 프롬프트</text><rect x="470" y="184" width="410" height="80" rx="10" fill="#e8f0fe" stroke="#1a73e8"/><text x="488" y="213" font-size="20" font-weight="700" fill="#202124">4 방법</text><text x="488" y="241" font-size="17" fill="#3c4043">네 방법의 역할 → 선택 이유</text><rect x="30" y="283" width="410" height="80" rx="10" fill="#e6f4ea" stroke="#137333"/><text x="48" y="312" font-size="20" font-weight="700" fill="#202124">5 절차</text><text x="48" y="340" font-size="17" fill="#3c4043">질문·답변·근거 → 추적 가능한 사례</text><rect x="470" y="283" width="410" height="80" rx="10" fill="#e6f4ea" stroke="#137333"/><text x="488" y="312" font-size="20" font-weight="700" fill="#202124">6 실습</text><text x="488" y="340" font-size="17" fill="#3c4043">24개 후보 한도 → 실패 검토 최대 3개</text><rect x="30" y="382" width="410" height="80" rx="10" fill="#e6f4ea" stroke="#137333"/><text x="48" y="411" font-size="20" font-weight="700" fill="#202124">7 인계</text><text x="48" y="439" font-size="17" fill="#3c4043">생성과 검증 구분 → 3강 질문</text><text x="30" y="499" font-size="16" fill="#5f6368">각 단계의 산출물을 다음 단계의 입력으로 연결한다. 강의용 개념도.</text></svg>