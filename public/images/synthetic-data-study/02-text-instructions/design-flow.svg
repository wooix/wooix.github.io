<svg xmlns="http://www.w3.org/2000/svg" width="900" height="540" viewBox="0 0 900 540" role="img" aria-label="생성 계획 → 검토 가능한 후보" font-family="Arial, Apple SD Gothic Neo, sans-serif"><rect width="900" height="540" rx="12" fill="white"/><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#5f6368"/></marker></defs><text x="30" y="45" font-size="25" font-weight="700" fill="#202124">생성 계획 → 검토 가능한 후보</text><rect x="20" y="100" width="260" height="140" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="38" y="134" fill="#1a73e8" font-size="21" font-weight="700">1. 목표 행동</text><text x="38" y="172" font-size="18" fill="#3c4043">무엇을 잘해야 하는가?</text><text x="38" y="199" font-size="18" fill="#3c4043">근거·정답 기준을 고정</text><rect x="320" y="100" width="260" height="140" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="338" y="134" fill="#1a73e8" font-size="21" font-weight="700">2. 생성 범위</text><text x="338" y="172" font-size="18" fill="#3c4043">주제 × 답변 가능 여부</text><text x="338" y="199" font-size="18" fill="#3c4043">× 제약 수준</text><rect x="620" y="100" width="260" height="140" rx="12" fill="#e8f0fe" stroke="#1a73e8" stroke-width="2"/><text x="638" y="134" fill="#1a73e8" font-size="21" font-weight="700">3. 생성 입력</text><text x="638" y="172" font-size="18" fill="#3c4043">과제 + 조건 + 예제</text><text x="638" y="199" font-size="18" fill="#3c4043">모델·버전·형식을 기록</text><rect x="620" y="310" width="260" height="140" rx="12" fill="#fef7e0" stroke="#b06000" stroke-width="2"/><text x="638" y="344" fill="#b06000" font-size="21" font-weight="700">4. 후보 생성</text><text x="638" y="382" font-size="18" fill="#3c4043">질문 → 응답·근거</text><text x="638" y="409" font-size="18" fill="#3c4043">아직 검증된 데이터 아님</text><rect x="320" y="310" width="260" height="140" rx="12" fill="#e6f4ea" stroke="#137333" stroke-width="2"/><text x="338" y="344" fill="#137333" font-size="21" font-weight="700">5. 검토 기록</text><text x="338" y="382" font-size="18" fill="#3c4043">실제 조건·근거 확인</text><text x="338" y="409" font-size="18" fill="#3c4043">의도와 결과를 분리</text><rect x="20" y="310" width="260" height="140" rx="12" fill="#e6f4ea" stroke="#137333" stroke-width="2"/><text x="38" y="344" fill="#137333" font-size="21" font-weight="700">6. 3강으로 인계</text><text x="38" y="382" font-size="18" fill="#3c4043">후보 + 출처 + 실패 이유</text><text x="38" y="409" font-size="18" fill="#3c4043">제거·수정·선택·비중 조정</text><path d="M280 170 H310" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M580 170 H610" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M750 240 V300" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M620 380 H590" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><path d="M320 380 H290" fill="none" stroke="#5f6368" stroke-width="2" marker-end="url(#arrow)"/><text x="30" y="503" font-size="17" fill="#5f6368">파랑: 사전 설계 · 주황: 생성 후보 · 초록: 검토와 인계 | 강의용 개념도</text></svg>